
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PodVerse AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f5f5fa;font-family:Arial;padding:25px}
main{max-width:900px;margin:25px auto;background:#1b1d2a;padding:28px;border-radius:16px}
h1{color:#a99aff;margin-bottom:5px}
p{color:#b9bacb;line-height:1.5}
label{display:block;margin-top:18px;margin-bottom:8px;font-weight:bold}
input,select,textarea,button{width:100%;padding:13px;border-radius:8px;border:1px solid #414355;background:#282a3b;color:white}
textarea{min-height:180px;resize:vertical}
button{background:#7965ee;border:0;font-weight:bold;cursor:pointer;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
#result{white-space:pre-wrap;line-height:1.7;background:#11131d;padding:18px;border-radius:10px;margin-top:20px}
.small{font-size:13px;color:#999}
@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:10px}main{padding:18px}}
</style>
</head>
<body>
<main>
<h1>PodVerse AI Studio</h1>
<p>Your personal podcast clipping workspace.</p>

<label>Podcast title (optional)</label>
<input id="title" placeholder="Enter podcast name">

<label>Paste transcript</label>
<textarea id="transcript" placeholder="Paste your podcast transcript here..."></textarea>

<label>Or upload a transcript (.txt)</label>
<input type="file" id="file" accept=".txt,text/plain">

<div class="grid">
<div>
<label>Publishing platform</label>
<select id="platform">
<option value="Instagram Reels">Instagram Reels (9:16)</option>
<option value="YouTube Shorts">YouTube Shorts (9:16)</option>
<option value="Instagram Posts">Instagram Posts (4:5)</option>
<option value="YouTube Long">YouTube Long (16:9)</option>
</select>
</div>
<div>
<label>Clip duration</label>
<select id="duration">
<option value="30">30 seconds</option>
<option value="40">40 seconds</option>
<option value="60">60 seconds</option>
<option value="120">2 minutes</option>
</select>
</div>
</div>

<label>Number of clips</label>
<select id="count">
<option value="3">3 clips</option>
<option value="5">5 clips</option>
<option value="10">10 clips</option>
</select>

<button onclick="generateClips()">Find Meaningful Moments</button>
<div id="result">Your clip suggestions will appear here.</div>
</main>

<script>
const fileInput=document.getElementById("file");
fileInput.addEventListener("change",async()=>{
 const file=fileInput.files[0];
 if(!file)return;
 if(file.size>5*1024*1024){
  alert("Please upload a TXT file smaller than 5 MB.");
  fileInput.value="";
  return;
 }
 document.getElementById("transcript").value=await file.text();
});

function generateClips(){
 const text=document.getElementById("transcript").value.trim();
 const result=document.getElementById("result");
 const duration=Number(document.getElementById("duration").value);
 const count=Number(document.getElementById("count").value);
 const platform=document.getElementById("platform").value;
 const title=document.getElementById("title").value.trim()||"Podcast";

 if(!text){result.textContent="Please paste or upload a transcript first.";return;}

 const sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];
 const clean=sentences.map(s=>s.trim()).filter(s=>s.length>25);
 if(!clean.length){result.textContent="Transcript is too short to create suggestions.";return;}

 const keywords=["because","secret","mistake","important","learned","success","failure","money","problem","solution","why","how","never","always","believe","experience","truth","difference","change","lesson","challenge","best","worst"];
 const ranked=clean.map((sentence,index)=>{
  const lower=sentence.toLowerCase();
  let score=0;
  keywords.forEach(word=>{if(lower.includes(word))score+=2;});
  if(sentence.length>60)score+=1;
  if(sentence.length>120)score+=1;
  if(index===0)score-=1;
  return {sentence,index,score};
 }).sort((a,b)=>b.score-a.score);

 const selected=ranked.slice(0,count).sort((a,b)=>a.index-b.index);
 const wordsPerSecond=2.5;
 const clipWords=Math.max(20,Math.round(duration*wordsPerSecond));
 let output=`${title}\nPlatform: ${platform}\nDuration target: ${duration} seconds\nAspect ratio: ${platform==="YouTube Long"?"16:9":platform==="Instagram Posts"?"4:5":"9:16"}\n\n`;
 output+="PRELIMINARY CLIP CANDIDATES\n\n";
 selected.forEach((item,i)=>{
  let context=[];
  let wordCount=0;
  for(let j=item.index;j<clean.length;j++){
   const next=clean[j];
   const n=next.split(/\s+/).length;
   if(wordCount+n>clipWords && context.length)break;
   context.push(next);
   wordCount+=n;
  }
  output+=`CLIP ${i+1}\n`;
  output+=`Transcript position: sentence ${item.index+1}\n`;
  output+=`Estimated duration: ${Math.round(wordCount/wordsPerSecond)} seconds\n`;
  output+=`Suggested content:\n${context.join(" ")}\n\n`;
 });
 output+="NOTE: These are transcript-based suggestions, not verified video timestamps. Human review is needed to confirm context and timing.";
 result.textContent=output;
}
</script>
</body>
</html>
