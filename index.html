
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodVerse AI Studio</title>
<style>
body{margin:0;background:#10111a;color:white;font-family:Arial,sans-serif;padding:30px}
main{max-width:750px;margin:40px auto;background:#1c1e2b;padding:28px;border-radius:16px}
h1{margin-top:0;color:#a99aff}
p{color:#c5c5d5}
input,select,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid #444;background:#292b3b;color:white}
button{background:#7663ed;border:0;font-weight:bold;cursor:pointer}
#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#11131c;padding:15px;border-radius:8px;margin-top:18px}
label{display:block;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>PodVerse AI Studio</h1>
<p>Turn your permitted podcast content into meaningful short clips.</p>

<label>YouTube Podcast Link</label>
<input id="videoUrl" type="url" placeholder="Paste YouTube link here">

<label>Platform</label>
<select id="platform">
<option>Instagram Reels</option>
<option>YouTube Shorts</option>
<option>Instagram Posts</option>
<option>YouTube Long Video</option>
</select>

<label>Clip Duration</label>
<select id="duration">
<option value="30">30 seconds</option>
<option value="40">40 seconds</option>
<option value="60">60 seconds</option>
<option value="120">2 minutes</option>
</select>

<label>Number of Clips</label>
<select id="count">
<option>3</option>
<option>5</option>
<option>10</option>
</select>

<button onclick="analyze()">Analyze Podcast</button>
<div id="result">Your analysis will appear here.</div>
</main>

<script>
async function analyze(){
 const url=document.getElementById("videoUrl").value.trim();
 const result=document.getElementById("result");
 if(!url){result.textContent="Please paste a YouTube link.";return;}
 result.textContent="Connecting to PodVerse server...";
 try{
  const response=await fetch("https://podverse-ai-studio.onrender.com/analyze",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({url})
  });
  const data=await response.json();
  if(data.success){
   result.textContent="Transcript received!\n\n"+data.transcript_segments.map(x=>x.text).join(" ");
  }else{
   result.textContent="Transcript could not be retrieved.\n\n"+(data.detail||data.message)+"\n\nYouTube may be blocking cloud-server requests.";
  }
 }catch(error){
  result.textContent="Could not connect to server. Please try again.";
 }
}
</script>
</body>
</html>
